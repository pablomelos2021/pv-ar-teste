<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nossa Senhora de Guadalupe — Imagem Viva</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family: Georgia, 'Times New Roman', serif; background:#241a0c; }
  #overlay {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:linear-gradient(180deg, rgba(46,32,10,.95), rgba(94,66,20,.95)); color:#fdf6e0; padding:24px;
  }
  #overlay h1 { font-size:23px; margin:0; letter-spacing:.5px; line-height:1.3; }
  #overlay p { font-size:15px; margin:0; max-width:340px; line-height:1.5; color:#f3e5bd; font-family: Arial, Helvetica, sans-serif; }
  #overlay img { width:150px; border-radius:12px; border:2px solid #d9a441; }
  #startBtn {
    background:#d9a441; color:#2e200a; border:0; border-radius:999px;
    font-size:18px; font-weight:bold; padding:14px 34px; cursor:pointer; font-family: Arial, Helvetica, sans-serif;
  }
  #startBtn:disabled { opacity:.6; }
  #status {
    position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:9;
    background:rgba(36,26,12,.8); color:#f3e5bd; padding:8px 16px; border-radius:999px;
    font-size:14px; display:none; white-space:nowrap; font-family: Arial, Helvetica, sans-serif;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>NOSSA SENHORA<br>DE GUADALUPE</h1>
  <img id="thumb" alt="Imagem de Nossa Senhora de Guadalupe">
  <p>Aponte a câmera para esta <b>imagem de Nossa Senhora de Guadalupe</b> (impressa ou aberta na tela de outro aparelho) e veja ela ganhar vida, contando a história da aparição.</p>
  <button id="startBtn">Abrir a câmera</button>
  <p style="font-size:12px; color:#cdb271">O vídeo tem som • Nenhuma imagem sai do seu celular</p>
</div>

<div id="status">Procurando a imagem…</div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="gvideo" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="gtarget" mindar-image-target="targetIndex: 0">
    <a-video src="#gvideo" width="1" height="1.7778" position="0 0 0.01"></a-video>
  </a-entity>
</a-scene>

<script>
  const sceneEl = document.querySelector('#scene');
  const targetEl = document.querySelector('#gtarget');
  const video = document.querySelector('#gvideo');
  const overlay = document.querySelector('#overlay');
  const status = document.querySelector('#status');
  const startBtn = document.querySelector('#startBtn');
  const thumb = document.querySelector('#thumb');

  function b64ToBytes(b64) {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function loadAssetBlobUrl(base, mime) {
    try {
      const r = await fetch(base);
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && !ct.includes('text/html')) {
        const buf = await r.arrayBuffer();
        if (buf.byteLength > 1000) return URL.createObjectURL(new Blob([buf], { type: mime }));
      }
    } catch (e) { /* fall through to .b64 */ }
    const txt = await (await fetch(base + '.b64')).text();
    return URL.createObjectURL(new Blob([b64ToBytes(txt)], { type: mime }));
  }

  (async () => {
    try {
      const r = await fetch('./alvo-guadalupe.png');
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && !ct.includes('text/html')) { thumb.src = './alvo-guadalupe.png'; return; }
      throw new Error('b64');
    } catch (e) {
      try {
        const txt = await (await fetch('./alvo-guadalupe.png.b64')).text();
        thumb.src = 'data:image/png;base64,' + txt.trim();
      } catch (e2) { thumb.style.display = 'none'; }
    }
  })();

  let started = false;
  startBtn.addEventListener('click', async () => {
    if (started) return;
    started = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Preparando…';
    try {
      const [mindUrl, videoUrl] = await Promise.all([
        loadAssetBlobUrl('./targets.mind', 'application/octet-stream'),
        loadAssetBlobUrl('./guadalupe-vivo.mp4', 'video/mp4')
      ]);
      video.src = videoUrl;
      video.load();
      // Prime playback inside the tap gesture so the video can play WITH sound later.
      try { await video.play(); video.pause(); video.currentTime = 0; } catch (e) { /* priming opcional */ }
      const sys = sceneEl.systems['mindar-image-system'];
      sys.setup({
        imageTargetSrc: mindUrl, maxTrack: 1, showStats: false,
        uiLoading: 'no', uiScanning: 'no', uiError: 'yes',
        missTolerance: null, warmupTolerance: null, filterMinCF: null, filterBeta: null
      });
      overlay.style.display = 'none';
      status.style.display = 'block';
      sys.start();
    } catch (e) {
      started = false;
      startBtn.disabled = false;
      startBtn.textContent = 'Tentar de novo';
    }
  });

  sceneEl.addEventListener('arError', () => {
    status.textContent = 'Não consegui abrir a câmera. Confira a permissão e tente de novo.';
    status.style.display = 'block';
  });

  targetEl.addEventListener('targetFound', () => {
    status.style.display = 'none';
    if (video.ended) video.currentTime = 0;
    video.play().catch(() => {});
  });
  targetEl.addEventListener('targetLost', () => {
    status.textContent = 'Procurando a imagem…';
    status.style.display = 'block';
    video.pause();
  });
</script>
</body>
</html>
