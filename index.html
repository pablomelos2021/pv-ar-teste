<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PV Informática — Cartão Vivo (teste AR)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family: Arial, Helvetica, sans-serif; background:#051630; }
  #overlay {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:linear-gradient(180deg, rgba(5,22,48,.94), rgba(11,55,110,.94)); color:#fff; padding:24px;
  }
  #overlay h1 { font-size:22px; margin:0; letter-spacing:1px; }
  #overlay p { font-size:15px; margin:0; max-width:340px; line-height:1.45; color:#cfeaff; }
  #overlay img { width:150px; border-radius:12px; border:2px solid #00c8ff; }
  #startBtn {
    background:#ffcb00; color:#0a1e3c; border:0; border-radius:999px;
    font-size:18px; font-weight:bold; padding:14px 34px; cursor:pointer;
  }
  #startBtn:disabled { opacity:.6; }
  #status {
    position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:9;
    background:rgba(5,22,48,.78); color:#cfeaff; padding:8px 16px; border-radius:999px;
    font-size:14px; display:none; white-space:nowrap;
  }
  #waBtn {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:9;
    background:#25d366; color:#fff; text-decoration:none; font-weight:bold; font-size:16px;
    padding:13px 26px; border-radius:999px; display:none; box-shadow:0 4px 18px rgba(0,0,0,.4);
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>PV INFORMÁTICA<br>CARTÃO VIVO</h1>
  <img id="thumb" alt="Cartão da PV">
  <p>Aponte a câmera para o <b>cartão da PV</b> (impresso ou aberto na tela de outro aparelho) e veja ele ganhar vida.</p>
  <button id="startBtn">Abrir a câmera</button>
  <p style="font-size:12px; color:#8fb8dd">Teste de realidade aumentada • Nenhuma imagem sai do seu celular</p>
</div>

<div id="status">Procurando o cartão da PV…</div>
<a id="waBtn" href="https://wa.me/5561999933230" target="_blank" rel="noopener">Chamar no WhatsApp</a>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="pvvideo" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="pvtarget" mindar-image-target="targetIndex: 0">
    <a-video src="#pvvideo" width="1" height="1.25" position="0 0 0.01"></a-video>
  </a-entity>
</a-scene>

<script>
  const sceneEl = document.querySelector('#scene');
  const targetEl = document.querySelector('#pvtarget');
  const video = document.querySelector('#pvvideo');
  const overlay = document.querySelector('#overlay');
  const status = document.querySelector('#status');
  const waBtn = document.querySelector('#waBtn');
  const startBtn = document.querySelector('#startBtn');
  const thumb = document.querySelector('#thumb');

  function b64ToBytes(b64) {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // Loads a binary asset. Works with the real file (local hosting) and with the
  // .b64 text version (GitHub Pages, where only text files were published).
  async function loadAssetBlobUrl(base, mime) {
    try {
      const r = await fetch(base);
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && !ct.includes('text/html')) {
        const buf = await r.arrayBuffer();
        if (buf.byteLength > 1000) return URL.createObjectURL(new Blob([buf], { type: mime }));
      }
    } catch (e) { /* fall through to .b64 */ }
    const txt = await (await fetch(base + '.b64')).text();
    return URL.createObjectURL(new Blob([b64ToBytes(txt)], { type: mime }));
  }

  (async () => {
    try {
      const r = await fetch('./cartao-alvo-pv.png');
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && !ct.includes('text/html')) { thumb.src = './cartao-alvo-pv.png'; return; }
      throw new Error('b64');
    } catch (e) {
      try {
        const txt = await (await fetch('./cartao-alvo-pv.png.b64')).text();
        thumb.src = 'data:image/png;base64,' + txt.trim();
      } catch (e2) { thumb.style.display = 'none'; }
    }
  })();

  let started = false;
  startBtn.addEventListener('click', async () => {
    if (started) return;
    started = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Preparando…';
    try {
      const [mindUrl, videoUrl] = await Promise.all([
        loadAssetBlobUrl('./targets.mind', 'application/octet-stream'),
        loadAssetBlobUrl('./pv-vivo.mp4', 'video/mp4')
      ]);
      video.src = videoUrl;
      video.load();
      try { await video.play(); video.pause(); } catch (e) { /* priming opcional */ }
      const sys = sceneEl.systems['mindar-image-system'];
      sys.setup({
        imageTargetSrc: mindUrl, maxTrack: 1, showStats: false,
        uiLoading: 'no', uiScanning: 'no', uiError: 'yes',
        missTolerance: null, warmupTolerance: null, filterMinCF: null, filterBeta: null
      });
      overlay.style.display = 'none';
      status.style.display = 'block';
      sys.start();
    } catch (e) {
      started = false;
      startBtn.disabled = false;
      startBtn.textContent = 'Tentar de novo';
    }
  });

  sceneEl.addEventListener('arError', () => {
    status.textContent = 'Não consegui abrir a câmera. Confira a permissão e tente de novo.';
    status.style.display = 'block';
  });

  targetEl.addEventListener('targetFound', () => {
    status.style.display = 'none';
    waBtn.style.display = 'block';
    video.play().catch(() => {});
  });
  targetEl.addEventListener('targetLost', () => {
    status.textContent = 'Procurando o cartão da PV…';
    status.style.display = 'block';
    waBtn.style.display = 'none';
    video.pause();
  });
</script>
</body>
</html>
